name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 (npm 11): el lockfile se genera con npm 11; con npm 10
          # la resolución del árbol difiere y `npm ci` falla (ver README).
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Next.js types
        # next-env.d.ts está en .gitignore; sin esto, tsc no conoce los
        # helpers globales LayoutProps/PageProps (los genera next dev/build/typegen)
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build
